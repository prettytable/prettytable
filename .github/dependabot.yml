version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "03:00"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "changelog: skip"
      - "dependencies"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      time: "03:00"
    groups:
      pip:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "changelog: skip"
      - "dependencies"
    cooldown:
      default-days: 7
